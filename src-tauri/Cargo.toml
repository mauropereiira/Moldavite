[package]
name = "moldavite"
version = "2.7.1"
description = "A local-first note-taking app for connected thinking"
authors = ["Mauro Pereira"]
license = "MIT"
repository = "https://github.com/mauropereiira/Moldavite"
edition = "2021"
rust-version = "1.88"

[lib]
name = "moldavite_lib"
# `staticlib` is what the generated Xcode project links on iOS.
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { version = "1.0", features = ["build"] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
dirs = "6.0"
chrono = "0.4"
regex = "1"
lazy_static = "1.4"
walkdir = "2.5"
unicode-normalization = "0.1"
sha2 = "0.10"
serde_yaml = "0.9"
notify = "6.1"
notify-debouncer-mini = "0.4"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native"] }

# Encryption dependencies for note locking
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
zeroize = { version = "1.7", features = ["derive"] }

# Export/Import and file dialogs
zip = "2.2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"

bincode = "1.3"

# Google Calendar REST + OAuth token exchange, WordPress.com, and plugin
# `net.fetch`. Not the process's only outbound HTTP: `fastembed` downloads
# models from Hugging Face over its own clients and `tauri-plugin-updater`
# brings its own; see docs/privacy.html for the documented destinations.
# `rustls-tls` is requested here, but fastembed's `hf-hub-native-tls` and
# `ort-download-binaries-native-tls` also turn on reqwest's `default-tls` for
# the whole graph, so a bare `Client::builder()` still picks the system TLS
# stack. Switching those two to the `-rustls-tls` variants is what would make
# rustls actually hold.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
# Desktop only. The App Store owns updates and the restart that follows
# them, and a phone has no window geometry to restore.
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# Restores window size and position between launches; no JS side needed.
tauri-plugin-window-state = "2"

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
# 2.4.x requires Tauri 2.10; keep this aligned with the app's Tauri 2.9.x line.
tauri-plugin-single-instance = { version = "=2.3.7", features = ["deep-link"] }

[target.'cfg(not(any(all(target_os = "macos", target_arch = "x86_64"), target_os = "ios", target_os = "android")))'.dependencies]
# Semantic (vector) search — fully local ONNX inference. ort-sys does not
# publish prebuilt ONNX Runtime binaries for Intel macOS, and mobile keeps
# the runtime out for app size, so those targets keep keyword search but do
# not compile or ship the semantic-search runtime. The code gates on the
# `semantic_runtime` cfg that build.rs derives from the same rule.
fastembed = { version = "5.17", default-features = false, features = [
    "ort-download-binaries-native-tls",
    "hf-hub-native-tls",
] }

[target.'cfg(target_os = "ios")'.dependencies]
# iOS ships SQLite with FTS5. Use the system library so the app does not
# bundle SQLite's desktop filesystem probes (statfs/fstatfs). The iOS 17
# deployment floor also covers rusqlite's SQLite 3.34.1 minimum.
rusqlite = { version = "0.40" }
tauri-plugin-icloud = { path = "plugins/tauri-plugin-icloud" }
tauri-plugin-document-export = { path = "plugins/tauri-plugin-document-export" }
tauri-plugin-mobile-ui = { path = "plugins/tauri-plugin-mobile-ui" }

[target.'cfg(not(target_os = "ios"))'.dependencies]
# Keep bundled FTS5 on desktop and Android, independent of the OS library.
rusqlite = { version = "0.40", features = ["bundled"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Native-messaging hosts are discovered through HKCU on Windows; every other
# platform finds them by directory.
winreg = "0.52"

[profile.release]
# Shipped builds only. `lto` and a single codegen unit let the optimiser work
# across crates, `strip` drops symbol tables nothing reads at runtime, and
# `panic = "abort"` removes unwinding tables (`catch_unwind` is test-only).
lto = true
codegen-units = 1
strip = true
panic = "abort"

# `test` gives us `tauri::test::mock_app`, the only way to exercise a real
# asset-protocol scope without launching a window. Not on Windows: the mock
# runtime it pulls in leaves the test binary unable to load there
# (STATUS_ENTRYPOINT_NOT_FOUND), so the scope test is Unix-only. The behaviour
# under test is platform-independent.
[target.'cfg(not(windows))'.dev-dependencies]
tauri = { version = "2.9.2", features = ["protocol-asset", "test"] }
