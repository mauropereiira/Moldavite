<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="Moldavite">
  <title>Moldavite</title>
  <!--
    The source of every generated icon. Regenerate with:

        npx tauri icon src-tauri/icons/icon-master.svg

    Cream on ink, not ink on cream. At 16px — favicon, menu bar, taskbar —
    an ink tile keeps its silhouette against any background, while a cream
    tile dissolves into a light one. The mark is the same monogram path the
    app draws in public/monogram.svg; if that changes, change it here too.
  -->
  <rect width="1024" height="1024" rx="230" ry="230" fill="#14120C"/>
  <!-- Mark at 56% of the tile. 50% tested visibly timid at 32px and below. -->
  <g transform="translate(110.9 110.87) scale(0.7466)">
    <g transform="translate(116.0 904.8) scale(1 -1)" fill="#F9F6ED">
      <path d="M208 426.25 421.25 65 634.5 426.25 682.5 0H805L708.75 735L421.25 260.25L133.75 735L37.5 0H160Z"/>
    </g>
  </g>
</svg>
