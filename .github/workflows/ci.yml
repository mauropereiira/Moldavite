name: Checks

on:
  push:
    branches: [main]
  # Every pull request, whatever its base. A PR stacked on another branch
  # used to get no checks at all, so its first CI run happened after it merged.
  pull_request:

# Fork PRs get a read-only token. Nothing here needs to write.
permissions:
  contents: read

jobs:
  # One job per check so each reports as its own required status. `matrix.run`
  # is a literal defined below, never event input, so interpolating it is safe.
  web:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      # Report every failure in one pass instead of cancelling siblings.
      fail-fast: false
      matrix:
        include:
          - task: check-version
            run: node scripts/bump-version.mjs --check
          - task: check-format
            run: npm run format:check
          # Ratchet: main sits at 16 warnings, 0 errors. Blocks new ones
          # without demanding the backlog get fixed first. Lower it as
          # warnings get cleared; never raise it.
          - task: check-js
            run: npm run lint -- --max-warnings 16
          - task: test-js
            run: npm test
          - task: build-web
            run: npm run build && npm run check:size
          # Production dependencies only; dev tooling never ships. Moderate
          # and above fails, which is the level the last batch sat at.
          - task: audit-js
            run: npm audit --omit=dev --audit-level=moderate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run ${{ matrix.task }}
        run: ${{ matrix.run }}

  # The clipper is its own npm package with its own dependencies (Readability,
  # Turndown, esbuild) and shares none of the app's build, so it gets its own job
  # rather than a matrix entry that would need the app's install.
  extension:
    name: test-extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: extension/package-lock.json

      - name: Install deps
        run: npm ci
        working-directory: extension

      - name: Test
        run: npm test
        working-directory: extension

      - name: Build
        run: npm run build
        working-directory: extension

  rust:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: check-rust
            run: cargo clippy --lib --all-targets -- -D warnings
          - task: test-rust
            run: cargo test --lib
          - task: check-fmt-rust
            run: cargo fmt --check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Install system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libgtk-3-dev \
            libayatana-appindicator3-dev

      # Pinned by SHA: a fork PR runs third-party actions, and a moving tag
      # is a supply-chain hole. Bump deliberately, not implicitly.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          # Keyed per task. Clippy and test build different artifacts, and on a
          # single shared key whichever job saves second just evicts the other.
          key: ${{ runner.os }}-cargo-${{ matrix.task }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Run ${{ matrix.task }}
        working-directory: src-tauri
        run: ${{ matrix.run }}

  # `cargo test --lib` proves the library compiles; it does not prove the app
  # builds or that an installer can be produced. Those two are exactly where
  # Windows breaks, and until now the first check of either happened after a
  # release tag was already pushed and the GitHub release already published.
  #
  # This does a real `tauri build`: frontend bundle, binary link, then MSI and
  # NSIS generation. Updater artifacts are switched off through a config
  # override rather than by handing CI a signing key — nothing here is
  # distributed, and fork PRs cannot read secrets anyway.
  #
  # It is the slowest job in the file (fastembed fetches ONNX Runtime binaries
  # at build time). That is the price of finding out on the PR instead of in
  # front of users.
  build-windows:
    name: build-windows
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-build-windows-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install deps
        run: npm ci

      # The override lives in a file rather than inline JSON: this step runs
      # under PowerShell, and quoting a JSON literal across shells is a trap.
      - name: Build app and installers
        run: npx tauri build --config src-tauri/tauri.ci.conf.json

      # Prove the bundler actually emitted both installers. `tauri build` can
      # succeed having produced fewer artifacts than configured, which is the
      # failure this job exists to catch.
      - name: Assert installers exist
        shell: pwsh
        run: |
          $root = "src-tauri/target/release/bundle"
          $msi = Get-ChildItem -Path "$root/msi" -Filter *.msi -ErrorAction SilentlyContinue
          $nsis = Get-ChildItem -Path "$root/nsis" -Filter *-setup.exe -ErrorAction SilentlyContinue
          if (-not $msi) { throw "No .msi produced in $root/msi" }
          if (-not $nsis) { throw "No NSIS -setup.exe produced in $root/nsis" }
          Write-Host "msi:  $($msi.Name)  $([math]::Round($msi.Length/1MB,1)) MB"
          Write-Host "nsis: $($nsis.Name)  $([math]::Round($nsis.Length/1MB,1)) MB"

  # Windows is a shipped target but nothing verified it until a release tag was
  # already pushed, so `#[cfg(windows)]` code and every `#[cfg(unix)]`-skipped
  # test went unproven. No apt step and no Swift/EventKit here; otherwise this
  # is the Linux job. First run is slow because `fastembed` fetches the ONNX
  # Runtime binaries at build time (Cargo.toml only excludes it on Intel macOS).
  rust-windows:
    name: ${{ matrix.task }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: check-rust-windows
            run: cargo clippy --lib --all-targets -- -D warnings
          - task: test-rust-windows
            run: cargo test --lib
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ matrix.task }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Run ${{ matrix.task }}
        working-directory: src-tauri
        run: ${{ matrix.run }}

  # cargo-audit checks Cargo.lock against the RustSec database. Nothing here
  # compiles the app, so no apt step; the cached binary is the slow part.
  audit-rust:
    name: audit-rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache cargo-audit
        id: cache-audit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-bin-v1

      - name: Install cargo-audit
        if: steps.cache-audit.outputs.cache-hit != 'true'
        run: cargo install cargo-audit --locked

      - name: Audit
        working-directory: src-tauri
        run: cargo audit

  # macOS is the primary shipped target and the only one that compiles the
  # Swift EventKit bridge, yet nothing built it before a release tag. Same
  # shape as the Windows job: no apt step, Xcode is already on the runner.
  rust-macos:
    name: ${{ matrix.task }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - task: check-rust-macos
            run: cargo clippy --lib --all-targets -- -D warnings
          - task: test-rust-macos
            run: cargo test --lib
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ matrix.task }}-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Run ${{ matrix.task }}
        working-directory: src-tauri
        run: ${{ matrix.run }}

  # Linux is a shipped target from this change on. Same reasoning as
  # build-windows: `cargo test --lib` proves the crate compiles, not that an
  # AppImage, a deb and an rpm come out. The name assertions match the exact
  # filenames release.yml's verification step requires, so a bundler naming
  # change fails here rather than after a tag is pushed.
  build-linux:
    name: build-linux
    # 24.04, not 22.04: the ONNX Runtime binary fastembed downloads is built
    # against glibc 2.38, so the link fails on 22.04's 2.35. That floor is
    # also what the shipped bundles require (Ubuntu 24.04, Debian 13, Fedora 39).
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Cache Cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-build-linux-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install deps
        run: npm ci

      # Tauri fetches its own linuxdeploy, a July 2024 build, into ~/.cache/tauri
      # and reuses whatever is there. That build still copies Ubuntu's
      # libwayland-client into the AppImage, and Fedora's and Arch's Mesa need
      # a symbol from a newer one, so the WebKit web process aborted with
      # "Could not create default EGL display" and the window stayed white
      # (#130). linuxdeploy excludes the library since November 2024; seed the
      # cache with a release that has it, pinned by checksum.
      - name: Use a linuxdeploy that leaves libwayland-client to the host
        run: |
          set -euo pipefail
          mkdir -p ~/.cache/tauri
          curl -fsSL -o ~/.cache/tauri/linuxdeploy-x86_64.AppImage \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20251107-1/linuxdeploy-x86_64.AppImage
          echo "c20cd71e3a4e3b80c3483cef793cda3f4e990aca14014d23c544ca3ce1270b4d  $HOME/.cache/tauri/linuxdeploy-x86_64.AppImage" | sha256sum -c
          chmod +x ~/.cache/tauri/linuxdeploy-x86_64.AppImage

      - name: Build app and bundles
        run: npx tauri build --config src-tauri/tauri.ci.conf.json --bundles appimage deb rpm

      - name: Assert bundles exist with the names the release expects
        run: |
          set -euo pipefail
          root=src-tauri/target/release/bundle
          version=$(node -p "require('./package.json').version")
          appimage="$root/appimage/Moldavite_${version}_amd64.AppImage"
          deb="$root/deb/Moldavite_${version}_amd64.deb"
          rpm="$root/rpm/Moldavite-${version}-1.x86_64.rpm"
          ls -la "$root/appimage" "$root/deb" "$root/rpm" || true
          [ -f "$appimage" ] || { echo "::error::Expected $appimage"; exit 1; }
          [ -f "$deb" ] || { echo "::error::Expected $deb"; exit 1; }
          [ -f "$rpm" ] || { echo "::error::Expected $rpm"; exit 1; }
          du -h "$appimage" "$deb" "$rpm"
          # The host's Mesa resolves against libwayland-client; a bundled copy
          # is the #130 blank window on Fedora and Arch.
          extracted=$(mktemp -d)
          (cd "$extracted" && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)
          if find "$extracted/squashfs-root" -name 'libwayland-client.so*' | grep -q .; then
            echo "::error::The AppImage bundles libwayland-client (#130)"; exit 1
          fi

      - name: Keep the bundles for the Fedora smoke test
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-bundles
          path: |
            src-tauri/target/release/bundle/appimage/Moldavite_*_amd64.AppImage
            src-tauri/target/release/bundle/rpm/Moldavite-*.x86_64.rpm
          if-no-files-found: error
          retention-days: 3

  # The AppImage carries Ubuntu's GTK and WebKitGTK and borrows the graphics
  # stack from whatever distribution runs it. Fedora's Mesa is newer than
  # Ubuntu 24.04's, and that mix is what shipped a blank white window in 2.6.0
  # (#130): the WebKit web process aborted in EGL setup before the first
  # paint, and nothing in CI could have noticed because the only Linux that
  # ever ran the bundles was the Ubuntu that built them. The rpm uses Fedora's
  # own WebKitGTK instead, and resolving its dependencies is part of the test.
  # Each bundle has to launch under Xvfb on Fedora, keep its web process alive,
  # and paint something other than a blank window.
  smoke-linux-fedora:
    name: smoke-linux-fedora
    needs: build-linux
    runs-on: ubuntu-24.04
    container:
      image: fedora:44
    timeout-minutes: 20
    steps:
      - name: Download the Linux bundles
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-bundles
          path: bundles

      - name: Install a headless desktop and the rpm
        run: |
          set -euo pipefail
          dnf install -y --setopt=install_weak_deps=False \
            xorg-x11-server-Xvfb ImageMagick mesa-dri-drivers mesa-libEGL mesa-libGL \
            dbus-daemon dbus-tools xdg-utils desktop-file-utils procps-ng
          rpm=$(find bundles -name 'Moldavite-*.x86_64.rpm' | head -n 1)
          dnf install -y "$rpm"
          # Extraction stands in for FUSE, which the container lacks. AppRun is
          # what the AppImage runtime executes after mounting the same tree.
          appimage=$(find bundles -name 'Moldavite_*_amd64.AppImage' | head -n 1)
          chmod +x "$appimage"
          (cd bundles && "$GITHUB_WORKSPACE/$appimage" --appimage-extract >/dev/null)

      - name: Launch each bundle under Xvfb
        run: |
          set -euo pipefail
          smoke() {
            local label=$1; shift
            local log="$RUNNER_TEMP/$label.log" shot="$RUNNER_TEMP/$label.png"
            Xvfb :99 -screen 0 1280x800x24 -nolisten tcp >/dev/null 2>&1 &
            local xvfb=$!
            sleep 2
            # setsid: the app, its WebKit processes and the session bus form
            # one process group that can be torn down together afterwards.
            DISPLAY=:99 setsid dbus-run-session -- "$@" >"$log" 2>&1 &
            local app=$!
            sleep 30
            local alive=1 web colors
            kill -0 "$app" 2>/dev/null || alive=0
            web=$(pgrep -c -f WebKitWebProcess || true)
            magick import -display :99 -window root "$shot" || true
            colors=$(magick identify -format '%k' "$shot" 2>/dev/null || echo 0)
            kill -TERM -- -"$app" 2>/dev/null || true
            sleep 2
            kill -KILL -- -"$app" 2>/dev/null || true
            pkill -KILL -f WebKitWebProcess || true
            kill "$xvfb" 2>/dev/null || true
            wait "$xvfb" 2>/dev/null || true
            echo "== $label: alive=$alive web-processes=$web distinct-colors=$colors"
            cat "$log"
            local failed=0
            if grep -q 'Could not create default EGL display' "$log"; then
              echo "::error::$label aborted in EGL setup, the #130 blank window"; failed=1
            fi
            [ "$alive" = 1 ] || { echo "::error::$label exited during startup"; failed=1; }
            [ "$web" -gt 0 ] || { echo "::error::$label has no WebKit web process"; failed=1; }
            # A mapped but unpainted window is two colors: its white and the
            # black root. Any rendered text pushes this into the hundreds.
            [ "$colors" -gt 32 ] || { echo "::error::$label painted a blank window ($colors colors)"; failed=1; }
            return $failed
          }
          status=0
          smoke appimage "$GITHUB_WORKSPACE/bundles/squashfs-root/AppRun" || status=1
          smoke rpm /usr/bin/moldavite || status=1
          exit $status

      - name: Keep the screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-smoke
          path: |
            ${{ runner.temp }}/*.png
            ${{ runner.temp }}/*.log
          if-no-files-found: warn
          retention-days: 3
