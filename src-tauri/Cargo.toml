[package]
name = "moldavite"
version = "2.4.1"
description = "A local-first note-taking app for connected thinking"
authors = ["Mauro Pereira"]
license = "MIT"
repository = "https://github.com/mauropereiira/Moldavite"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "moldavite_lib"
crate-type = ["lib", "cdylib"]

[build-dependencies]
tauri-build = { version = "2.5.1", features = [] }

[target.'cfg(target_os = "macos")'.build-dependencies]
swift-rs = { version = "1.0", features = ["build"] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
dirs = "5.0"
chrono = "0.4"
regex = "1"
lazy_static = "1.4"
walkdir = "2.5"
unicode-normalization = "0.1"
sha2 = "0.10"
serde_yaml = "0.9"
notify = "6.1"
notify-debouncer-mini = "0.4"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "linux-native"] }

# Encryption dependencies for note locking
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
base64 = "0.22"
zeroize = { version = "1.7", features = ["derive"] }

# Export/Import and file dialogs
zip = "2.2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"

bincode = "1.3"

# Google Calendar REST + OAuth token exchange. rustls keeps this off the system
# TLS stack; this is the only outbound HTTP the Rust process makes.
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }

[target.'cfg(any(target_os = "linux", target_os = "macos", target_os = "windows"))'.dependencies]
# 2.4.x requires Tauri 2.10; keep this aligned with the app's Tauri 2.9.x line.
tauri-plugin-single-instance = { version = "=2.3.7", features = ["deep-link"] }

[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
# Semantic (vector) search — fully local ONNX inference. ort-sys does not
# publish prebuilt ONNX Runtime binaries for Intel macOS, so that target keeps
# keyword search but does not compile or ship the semantic-search runtime.
fastembed = { version = "5.17", default-features = false, features = [
    "ort-download-binaries-native-tls",
    "hf-hub-native-tls",
] }

[target.'cfg(target_os = "macos")'.dependencies]
swift-rs = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
# Native-messaging hosts are discovered through HKCU on Windows; every other
# platform finds them by directory.
winreg = "0.52"
