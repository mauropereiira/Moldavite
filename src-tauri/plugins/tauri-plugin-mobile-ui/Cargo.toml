[package]
name = "tauri-plugin-mobile-ui"
version = "0.1.0"
edition = "2021"
links = "tauri-plugin-mobile-ui"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.9.2", default-features = false, features = ["wry"] }

[build-dependencies]
tauri-plugin = { version = "=2.5.1", features = ["build"] }
